<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="dashboard" id="main-content">

    <!-- Hero / Clock Section -->
    <section class="hero card" aria-label="Clock and greeting">
      <header class="theme-row">
        <strong class="logo" aria-label="Life Dashboard">LIFE<span aria-hidden="true">.</span></strong>
        <button id="themeToggle" class="icon-btn" aria-label="Toggle theme" type="button">☾</button>
      </header>
      <time class="eyebrow" id="date" aria-live="polite">Loading date...</time>
      <h1 id="time" aria-live="polite" aria-label="Current time">00:00:00</h1>
      <p id="greeting" class="greeting">Good Morning</p>
      <p class="subtitle">Hello, <span id="displayName">there</span>. Make today count.</p>
      <form class="name-form" aria-label="Set your name" onsubmit="return false;">
        <label for="nameInput" class="sr-only">Your name</label>
        <input id="nameInput" type="text" placeholder="Set your name" autocomplete="name">
        <button id="saveName" type="submit">Save</button>
      </form>
    </section>

    <!-- Focus Timer Section -->
    <section class="timer card" aria-label="Focus timer">
      <header class="section-heading">
        <div>
          <p class="eyebrow">PRODUCTIVITY</p>
          <h2>Focus Timer</h2>
        </div>
        <span class="status-dot" role="status" aria-label="Timer status"></span>
      </header>
      <output class="timer-display" id="timerDisplay" aria-live="polite" aria-label="Timer countdown">25:00</output>
      <div class="timer-controls" role="group" aria-label="Timer controls">
        <button id="startTimer" class="primary" type="button">Start</button>
        <button id="stopTimer" type="button">Pause</button>
        <button id="resetTimer" type="button">Reset</button>
      </div>
      <form class="custom-timer" aria-label="Custom timer duration" onsubmit="return false;">
        <label for="timerMinutes">Minutes</label>
        <input id="timerMinutes" type="number" min="1" max="120" value="25">
        <button id="applyTimer" type="submit">Apply</button>
      </form>
    </section>

    <!-- Tasks Section -->
    <section class="tasks card" aria-label="Task list">
      <header class="section-heading">
        <div>
          <p class="eyebrow">YOUR DAY</p>
          <h2>Tasks</h2>
        </div>
        <output id="taskCount" aria-live="polite" aria-label="Task count">0 tasks</output>
      </header>

      <form class="task-input-row" aria-label="Add a new task" onsubmit="return false;">
        <label for="taskInput" class="sr-only">New task</label>
        <input id="taskInput" type="text" placeholder="What needs to be done?" autocomplete="off">
        <button id="addTask" class="primary" type="submit">Add Task</button>
      </form>

      <div class="task-toolbar">
        <label for="sortTasks" class="sr-only">Sort tasks</label>
        <select id="sortTasks" aria-label="Sort tasks">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="az">A–Z</option>
          <option value="unfinished">Unfinished first</option>
        </select>
        <button id="clearCompleted" class="text-btn" type="button">Clear completed</button>
      </div>

      <ul id="taskList" class="task-list" role="list" aria-label="Tasks"></ul>
      <p id="emptyTasks" class="empty-state" role="status">No tasks yet. Start with one small step.</p>
    </section>

    <!-- Quick Links Section -->
    <section class="links card" aria-label="Quick links">
      <header class="section-heading">
        <div>
          <p class="eyebrow">FAVORITES</p>
          <h2>Quick Links</h2>
        </div>
      </header>
      <form class="link-form" aria-label="Add a new quick link" onsubmit="return false;">
        <label for="linkName" class="sr-only">Website name</label>
        <input id="linkName" type="text" placeholder="Website name" autocomplete="off">
        <label for="linkUrl" class="sr-only">Website URL</label>
        <input id="linkUrl" type="url" placeholder="https://example.com" autocomplete="url">
        <button id="addLink" class="primary" type="submit">Add Link</button>
      </form>
      <nav id="linkList" class="link-list" aria-label="Saved quick links"></nav>
    </section>

  </main>

  <footer role="contentinfo">
    <p>Life Dashboard · Stay focused, stay consistent.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
